      <span class="flag-counter" id="flagCounter">0 / 0 flagged</span>
      <button class="header-btn cover-all" id="coverAllBtn" title="Cover all countries with flags">&#127760; Cover All</button>
      <button class="header-btn clear-all" id="clearAllBtn" title="Clear all flags">&#10060; Clear All</button>
      <span class="stats-badge" id="statsBadge">0 visited</span>
      <div class="theme-toggle" id="themeToggle" title="Toggle Day/Night">
        <div class="theme-toggle-knob"></div>
      </div>
    </div>
  </header>

  <!-- Map -->
  <div id="map"></div>

  <!-- Detail Panel -->
  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-panel" id="detailPanel">
      <button class="detail-close" id="detailClose" title="Close">&times;</button>
      <img class="detail-flag" id="detailFlag" src="" alt="Country flag" />
      <div class="detail-name" id="detailName"></div>
      <div class="detail-capital" id="detailCapital"></div>
      <div class="badges" id="detailBadges"></div>
      <div class="detail-population" id="detailPopulation"></div>
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">Currency</div>
          <div class="info-value" id="detailCurrency">--</div>
        </div>
        <div class="info-item">
          <div class="info-label">Languages</div>
          <div class="info-value" id="detailLanguages">--</div>
        </div>
      </div>
      <div class="passport-block" id="detailPassportBlock" style="display:none;">
        <img class="passport-photo" id="detailPassportPhoto" src="" alt="Passport" />
        <div class="passport-meta">
          <div class="passport-title">Passport Power</div>
          <div class="passport-rank" id="detailPassportText"></div>
          <div class="passport-fact" id="detailPassportFact"></div>
        </div>
      </div>
      <div class="country-images" id="countryImages">
        <div class="country-images-header">
          <div class="country-images-title">Snapshots</div>
          <button class="country-images-refresh" id="refreshImagesBtn" title="Load new images">&#8635; New photos</button>
        </div>
        <div class="country-images-grid" id="countryImagesGrid"><span style="grid-column:1/-1;text-align:center;opacity:0.5;font-size:0.8rem">Select a country to see photos</span></div>
      </div>
      <div class="map-embed">
        <iframe id="detailMapFrame" src="" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <div class="ai-section" id="aiSection">
        <div class="ai-loading" id="aiLoading" style="display:none;">
          <span class="spinner"></span> Fetching AI insights...
        </div>
        <div id="aiContent" style="display:none;">
          <div class="fun-fact-block" id="funFactBlock">
            <strong>Fun Fact</strong>
            <span id="funFactText"></span>
          </div>
          <div class="dish-block" id="dishBlock">
            <strong>Traditional Dish</strong>
            <span id="dishText"></span>
          </div>
        </div>
      </div>
      <button class="mark-visited-btn" id="markVisitedBtn" type="button">Mark as Visited</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="countries-data.js"></script>
  <script>
    (function () {
      'use strict';

      // --- Config ---
      const apiKey = (typeof GEMINI_API_KEY !== 'undefined' && GEMINI_API_KEY !== 'YOUR_API_KEY_HERE') ? GEMINI_API_KEY : '';
      var isTouch = (window.L && L.Browser && L.Browser.touch) || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      let isDark = true;
      let countriesCache = null;
      let currentCountry = null;
      let geoLayer = null;
      let selectedLayer = null;

      // --- Color palettes (direct values, no CSS variable lookups) ---
      var colors = {
        dark: { land: '#46557a', landBorder: '#243049', landHover: '#6a7cc4', visited: '#2f9558' },
        light: { land: '#f0e9d6', landBorder: '#b3a98c', landHover: '#ffd27f', visited: '#84c98f' }
      };

      function getColors() { return isDark ? colors.dark : colors.light; }

      // --- DOM ---
      const themeToggle = document.getElementById('themeToggle');
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const headerActions = document.querySelector('.header-actions');

      // Hamburger menu toggle
      hamburgerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        headerActions.classList.toggle('mobile-open');
        hamburgerBtn.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.header-actions') && !e.target.closest('.hamburger-btn')) {
          headerActions.classList.remove('mobile-open');
          hamburgerBtn.classList.remove('open');
        }
      });

      const statsBadge = document.getElementById('statsBadge');
      const detailOverlay = document.getElementById('detailOverlay');
      const detailPanel = document.getElementById('detailPanel');
      const detailClose = document.getElementById('detailClose');
      const detailFlag = document.getElementById('detailFlag');
      const detailName = document.getElementById('detailName');
      const detailCapital = document.getElementById('detailCapital');
      const detailBadges = document.getElementById('detailBadges');
      const detailPopulation = document.getElementById('detailPopulation');
      const detailCurrency = document.getElementById('detailCurrency');
      const detailLanguages = document.getElementById('detailLanguages');
      const detailPassportBlock = document.getElementById('detailPassportBlock');
      const detailPassportPhoto = document.getElementById('detailPassportPhoto');
      const detailPassportText = document.getElementById('detailPassportText');
      const detailPassportFact = document.getElementById('detailPassportFact');
      const detailMapFrame = document.getElementById('detailMapFrame');

      const aiLoading = document.getElementById('aiLoading');
      const aiContent = document.getElementById('aiContent');
      const funFactText = document.getElementById('funFactText');
      const dishText = document.getElementById('dishText');
      const markVisitedBtn = document.getElementById('markVisitedBtn');
      const flagCounter = document.getElementById('flagCounter');
      const coverAllBtn = document.getElementById('coverAllBtn');
      const clearAllBtn = document.getElementById('clearAllBtn');

      // Track which countries are flagged (persists across page reloads)
      var flaggedCountries = new Set();
      (function loadFlaggedCountries() {
        try {
          var saved = JSON.parse(localStorage.getItem('flagged_countries_list') || '[]');
          if (Array.isArray(saved)) saved.forEach(function (n) { flaggedCountries.add(n); });
        } catch (e) {}
      })();

      function saveFlaggedCount() {
        localStorage.setItem('flagged_countries_count', flaggedCountries.size.toString());
        localStorage.setItem('flagged_countries_list', JSON.stringify(Array.from(flaggedCountries)));
      }

      // --- Theme ---
      themeToggle.addEventListener('click', function () {
        isDark = !isDark;
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
        // Re-style all non-selected layers (skip flagged ones to preserve flags)
        if (geoLayer) {
          geoLayer.eachLayer(function (layer) {
            if (layer._flagPatternId) return; // don't touch flagged layers
            if (layer !== selectedLayer) {
              var isVis = layer._countryData && isVisited(layer._countryData.name.common);
              layer.setStyle(isVis ? visitedStyle() : defaultStyle());
            }
          });
        }
      });

      // --- Visited helpers (shared localStorage with index.html) ---
      function getVisited() {
        try { return JSON.parse(localStorage.getItem('visited_countries')) || []; }
        catch { return []; }
      }

      function saveVisited(list) {
        localStorage.setItem('visited_countries', JSON.stringify(list));
      }

      function isVisited(name) {
        return getVisited().includes(name);
      }

      function toggleVisited(name) {
        const list = getVisited();
        if (!list.includes(name)) {
          list.push(name);
          saveVisited(list);
        }
        updateStats();
        updateVisitedBadge();
      }

      function updateStats() {
        statsBadge.textContent = getVisited().length + ' visited';
      }

      function getTotalCountries() {
        if (!geoLayer) return 0;
        var seen = new Set();
        geoLayer.eachLayer(function (l) {
          var name = l._countryData ? l._countryData.name.common : (l._featureId || '');
          if (name) seen.add(name);
        });
        return seen.size;
      }

      function updateFlagCounter() {
        var total = getTotalCountries();
        var covered = flaggedCountries.size;
        var remaining = total - covered;
        flagCounter.textContent = covered + ' / ' + total + ' flagged (' + remaining + ' left)';
        saveFlaggedCount();
      }

      // --- Cover All Countries with Flags ---
      coverAllBtn.addEventListener('click', function () {
        if (!geoLayer) return;
        var groups = {};
        geoLayer.eachLayer(function (l) {
          var name = l._countryData ? l._countryData.name.common : null;
          if (!name) return;
          if (!groups[name]) groups[name] = [];
          groups[name].push(l);
        });
        Object.keys(groups).forEach(function (name) {
          var g = groups[name];
          var country = g[0]._countryData;
          if (!country) return;
          g.forEach(function (l, idx) {
            try { applyFlagFill(l, country, idx); } catch (e) {}
          });
          flaggedCountries.add(name);
        });
        updateFlagCounter();
      });

      // --- Clear All Flags ---
      clearAllBtn.addEventListener('click', function () {
        if (!geoLayer) return;
        geoLayer.eachLayer(function (l) {
          clearFlagFill(l);
          var isVis = l._countryData && isVisited(l._countryData.name.common);
          l.setStyle(isVis ? visitedStyle() : defaultStyle());
        });
        flaggedCountries.clear();
        selectedLayer = null;
        updateFlagCounter();
      });

      // --- Leaflet Map ---
      // Use a plate-carrée / equirectangular projection (EPSG:4326) instead of
      // the default Web Mercator. Mercator cannot render latitudes beyond ±85°,
      // which is what mangled Antarctica / the south pole. EPSG:4326 maps lon→x
      // and lat→y linearly, so the whole world (-90..90) fits as a clean 2:1
      // rectangle and country sizes look far more realistic.
      const map = L.map('map', {
        crs: L.CRS.EPSG4326,
        center: [20, 0],
        zoom: 1,
        minZoom: 0,
        maxZoom: 7,
        zoomControl: true,
        zoomSnap: 0,
        renderer: L.svg({ padding: 0.5 }),
        worldCopyJump: false,
        maxBounds: [[-95, -205], [95, 205]],
        maxBoundsViscosity: 1.0
      });

      // While the mouse button is held (panning / sweeping), suppress hover
      // highlights AND tooltips. We key off mousedown so it's active from the
      // very first pixel of the drag, not only after the map starts moving.
      var isDragging = false;
      function beginDrag() {
        isDragging = true;
        document.body.classList.add('map-dragging');
        if (geoLayer) geoLayer.eachLayer(function (l) { if (l.closeTooltip) l.closeTooltip(); });
      }
      function finishDrag() {
        if (!isDragging) return;
        isDragging = false;
        document.body.classList.remove('map-dragging');
        if (geoLayer) geoLayer.eachLayer(function (l) { if (l.closeTooltip) l.closeTooltip(); });
      }
      map.on('mousedown', beginDrag);
      map.on('movestart', beginDrag);
      map.on('moveend', finishDrag);
      map.getContainer().addEventListener('mousedown', beginDrag);
      document.addEventListener('mouseup', finishDrag);

      // No tile layer — plain colored background (cartoon style)

      // --- Styles (thinner borders to minimize seam artifacts) ---
      function defaultStyle() {
        var c = getColors();
        return { weight: 0.8, color: c.landBorder, fillColor: c.land, fillOpacity: 1, opacity: 0.9 };
      }

      function hoverStyle() {
        var c = getColors();
        return { weight: 1.5, color: 'rgba(255,255,255,0.7)', fillColor: c.landHover, fillOpacity: 1, opacity: 1 };
      }

      function visitedStyle() {
        var c = getColors();
        return { weight: 1.2, color: isDark ? '#2ecc71' : '#1a8a4a', fillColor: c.visited, fillOpacity: 1, opacity: 0.9 };
      }

      // Antarctica reaches the south pole, which in this projection flattens
      // into a full-width line along the very bottom of the map. Drawing it
      // without a border removes that stray line while keeping the landmass.
      function antarcticaStyle() {
        var c = getColors();
        return { weight: 0, color: c.land, fillColor: c.land, fillOpacity: 1, opacity: 0 };
      }

      // --- Dateline normalization ------------------------------------------
      // Countries that straddle the 180° meridian (Fiji, Kiribati, New Zealand,
      // USA/Aleutians, Russia/Chukotka, …) arrive with some islands at +179 and
      // others at -179. On a flat map that scatters a single country's pieces to
      // opposite edges. We "unwrap" every feature around a reference meridian
      // (the centroid longitude of its LARGEST ring) so every part of a country
      // stays within ±180° of that reference — i.e. contiguous and together.
      //
      // Antarctica (id 010) is left untouched: it genuinely encircles the pole
      // and is authored as a band that spans the full width, so shifting it
      // would only introduce a seam.
      // Dateline-safe area + centroid longitude for a single ring. Longitudes
      // are unwrapped relative to the ring's first vertex before the shoelace
      // sum, so a ring that itself crosses 180° doesn't get a wildly inflated
      // area (which would otherwise hijack the reference meridian, e.g. Fiji).
      function ringStats(ring) {
        if (ring.length < 3) return { area: 0, centerLon: ring.length ? ring[0][0] : 0 };
        var ref = ring[0][0];
        var xs = new Array(ring.length);
        for (var i = 0; i < ring.length; i++) {
          var x = ring[i][0];
          while (x - ref > 180) x -= 360;
          while (x - ref < -180) x += 360;
          xs[i] = x;
        }
        var a = 0, sx = 0;
        for (var k = 0, n = ring.length, j = n - 1; k < n; j = k++) {
          a += (xs[j] * ring[k][1]) - (xs[k] * ring[j][1]);
          sx += xs[k];
        }
        var center = sx / ring.length;
        while (center > 180) center -= 360;
        while (center < -180) center += 360;
        return { area: Math.abs(a / 2), centerLon: center };
      }

      function eachRing(geom, fn) {
        if (geom.type === 'Polygon') {
          geom.coordinates.forEach(fn);
        } else if (geom.type === 'MultiPolygon') {
          geom.coordinates.forEach(function (poly) { poly.forEach(fn); });
        }
      }

      // Reference meridian = centroid longitude of the country's largest ring
      // (its main landmass), so outlying islands are unwrapped to sit beside it.
      function referenceLon(geom) {
        var bestCenter = 0, bestArea = -1;
        eachRing(geom, function (ring) {
          var st = ringStats(ring);
          if (st.area > bestArea) { bestArea = st.area; bestCenter = st.centerLon; }
        });
        return bestArea >= 0 ? bestCenter : 0;
      }

      function unwrapLongitudes(geojson) {
        geojson.features.forEach(function (feature) {
          if (feature.id === '010') return; // leave Antarctica as-is
          var ref = referenceLon(feature.geometry);
          eachRing(feature.geometry, function (ring) {
            for (var i = 0; i < ring.length; i++) {
              var lon = ring[i][0];
              while (lon - ref > 180) lon -= 360;
              while (lon - ref < -180) lon += 360;
              ring[i][0] = lon;
            }
          });
        });
        return geojson;
      }

      // --- Load BOTH datasets before building the map ---
      function loadTopoJSON(url) {
        return fetch(url).then(function (r) {
          if (!r.ok) throw new Error('TopoJSON fetch failed: ' + r.status);
          return r.json();
        });
      }

      var topoPromise = loadTopoJSON('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')
        .catch(function () {
          return loadTopoJSON('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
        });

      var apiPromise = fetchAllCountries().catch(function (err) {
        console.error('Country data failed:', err);
        return [];
      });

      Promise.all([topoPromise, apiPromise]).then(function (results) {
        var topoData = results[0];
        var countries = results[1];
        var geojson = topojson.feature(topoData, topoData.objects.countries);

        // Keep each country's geometry contiguous across the 180° meridian
        unwrapLongitudes(geojson);

        // Split MultiPolygons into individual Polygons so each island
        // gets its own SVG path and its own perfectly fitted flag pattern.
        // Exception: Antarctica (ID 010) stays as one shape to avoid 100+ fragments.
        var splitFeatures = [];
        geojson.features.forEach(function (feature) {
          if (feature.geometry.type === 'MultiPolygon' && feature.id !== '010') {
            feature.geometry.coordinates.forEach(function (polyCoords) {
              splitFeatures.push({
                type: 'Feature',
                id: feature.id,
                properties: feature.properties,
                geometry: { type: 'Polygon', coordinates: polyCoords }
              });
            });
          } else {
            splitFeatures.push(feature);
          }
        });
        geojson.features = splitFeatures;

        // We'll collect layers by country key to group them after creation
        var countryGroups = {}; // key -> [layer, layer, ...]

        // Resolve the country/territory a TopoJSON feature belongs to.
        // Priority: numeric ISO code -> RestCountries name -> hardcoded
        // territory table (keyed by the exact TopoJSON name). No geographic
        // guessing, so ID-less features like "Indian Ocean Ter." and
        // "Siachen Glacier" are never mislabeled as a neighbouring territory.
        function resolveCountry(feature) {
          var match = findCountryByNumeric(countries, feature.id);
          var fname = feature.properties && feature.properties.name;
          if (!match && fname) match = findCountryByName(countries, fname);
          if (!match && fname && TERRITORY_BY_NAME[fname]) match = TERRITORY_BY_NAME[fname];
          return match;
        }

        geoLayer = L.geoJSON(geojson, {
          style: function (feature) {
            if (feature.id === '010') return antarcticaStyle();
            var match = resolveCountry(feature);
            if (match && isVisited(match.name.common)) return visitedStyle();
            return defaultStyle();
          },
          onEachFeature: function (feature, layer) {
            var match = resolveCountry(feature);
            if (match) {
              layer._countryData = match;
            }
            var displayName = match ? match.name.common : (feature.properties && feature.properties.name || '');
            if (displayName) {
              layer.bindTooltip(displayName, {
                className: 'country-tooltip',
                sticky: true,
                direction: 'top',
                offset: [0, -10]
              });
            }
            layer._featureId = feature.id;

            // Group key: country name if matched, else the feature's own name,
            // else its id. This keeps each country's islands linked together
            // (and keeps unmatched territories grouped with themselves only).
            var groupKey = match ? match.name.common
              : ((feature.properties && feature.properties.name) || feature.id || Math.random().toString());
            if (!countryGroups[groupKey]) countryGroups[groupKey] = [];
            countryGroups[groupKey].push(layer);

            layer.on('mouseover', onMouseOver);
            layer.on('mouseout', onMouseOut);
            layer.on('click', onCountryClick);
          }
        }).addTo(map);

        // Link sibling layers: each layer gets _countryGroup = array of ALL layers for that country
        Object.keys(countryGroups).forEach(function (key) {
          var group = countryGroups[key];
          group.forEach(function (layer) {
            layer._countryGroup = group;
          });
        });

        // Build proximity clusters WITHIN each country: a connected landmass and
        // its nearby islets. Hovering / flying then targets just that cluster, so
        // hovering mainland France no longer lights up French Guiana (South
        // America) or Réunion/Mayotte (Indian Ocean) thousands of km away.
        Object.keys(countryGroups).forEach(function (key) {
          var group = countryGroups[key];
          var items = group.map(function (l) {
            var b = l.getBounds();
            return { layer: l, s: b.getSouth(), n: b.getNorth(), w: b.getWest(), e: b.getEast(), parent: -1 };
          });
          function find(i) { while (items[i].parent !== -1) i = items[i].parent; return i; }
          function union(a, b) { var ra = find(a), rb = find(b); if (ra !== rb) items[rb].parent = ra; }
          var T = 5; // degrees: pieces within ~5° of each other are one cluster
          for (var a = 0; a < items.length; a++) {
            for (var b = a + 1; b < items.length; b++) {
              var A = items[a], B = items[b];
              var dx = Math.max(0, A.w - B.e, B.w - A.e);
              var dy = Math.max(0, A.s - B.n, B.s - A.n);
              if (dx * dx + dy * dy < T * T) union(a, b);
            }
          }
          var clusters = {};
          for (var i = 0; i < items.length; i++) {
            var r = find(i);
            (clusters[r] = clusters[r] || []).push(items[i].layer);
          }
          Object.keys(clusters).forEach(function (r) {
            var cl = clusters[r];
            cl.forEach(function (l) { l._cluster = cl; });
          });
        });

        updateStats();
        updateFlagCounter();

        // Fill the page completely (cover-fit): pick the zoom at which the
        // world fills the viewport with no empty letterbox bands, and lock that
        // as the minimum zoom. Antarctica's over-stretched tip sits below this
        // framing, so it's out of the default view. If the user arrived from
        // Explorer with a target country, the fly-to below overrides this.
        try {
          var worldB = L.latLngBounds([[-56, -180], [82, 180]]);
          map.setMinZoom(0);
          var coverZoom = map.getBoundsZoom(worldB, true);
          map.setView(worldB.getCenter(), coverZoom, { animate: false });
          map.setMinZoom(coverZoom);
        } catch (e) {}

        // Restore previously flagged countries from localStorage
        if (flaggedCountries.size > 0) {
          var restoreGroups = {};
          geoLayer.eachLayer(function (l) {
            var name = l._countryData ? l._countryData.name.common : null;
            if (!name || !flaggedCountries.has(name)) return;
            if (!restoreGroups[name]) restoreGroups[name] = [];
            restoreGroups[name].push(l);
          });
          Object.keys(restoreGroups).forEach(function (name) {
            var group = restoreGroups[name];
            var country = group[0]._countryData;
            if (!country) return;
            group.forEach(function (l, idx) {
              try { applyFlagFill(l, country, idx); } catch (e) {}
            });
          });
        }

        // Apply green style to visited countries on initial load
        highlightVisitedOnMap();

        // --- Handle incoming country from Explorer (via sessionStorage) ---
        var incomingPayload = null;
        try {
          var raw = sessionStorage.getItem('terraexplorer_mapcountry');
          if (raw) {
            incomingPayload = JSON.parse(raw);
            sessionStorage.removeItem('terraexplorer_mapcountry');
          }
        } catch (_) {}

        if (incomingPayload && incomingPayload.country) {
          var incomingCountry = incomingPayload.country;
          // Find the first layer matching this country
          var targetLayer = null;
          var inLower = incomingCountry.toLowerCase();

          // Pass 1: exact match on _countryData.name.common
          geoLayer.eachLayer(function (l) {
            if (!targetLayer && l._countryData && l._countryData.name &&
                l._countryData.name.common.toLowerCase() === inLower) {
              targetLayer = l;
            }
          });

          // Pass 2: partial / includes match
          if (!targetLayer) {
            geoLayer.eachLayer(function (l) {
              if (!targetLayer && l._countryData && l._countryData.name) {
                var cn = l._countryData.name.common.toLowerCase();
                if (cn.includes(inLower) || inLower.includes(cn)) {
                  targetLayer = l;
                }
              }
            });
          }

          // Pass 3: match by feature.properties.name (TopoJSON name)
          if (!targetLayer) {
            geoLayer.eachLayer(function (l) {
              if (!targetLayer && l.feature && l.feature.properties && l.feature.properties.name) {
                var fn = l.feature.properties.name.toLowerCase();
                if (fn === inLower || fn.includes(inLower) || inLower.includes(fn)) {
                  targetLayer = l;
                }
              }
            });
          }

          if (targetLayer) {
            // Simulate a click on this country
            var country = targetLayer._countryData || {
              name: { common: incomingCountry }, flags: {}, population: null,
              region: '', subregion: '', capital: [], currencies: {},
              languages: {}, latlng: null, ccn3: ''
            };
            selectedLayer = targetLayer;
            currentCountry = country;

            var hasPassedFacts = !!(incomingPayload.funFact || incomingPayload.dish);
            showDetail(country, hasPassedFacts);

            // Fly to bounds (slight delay ensures map is rendered)
            var grp = getGroup(targetLayer);
            var cluster = getCluster(targetLayer);
            var bounds = L.latLngBounds([]);
            cluster.forEach(function (l) { bounds.extend(l.getBounds()); });
            setTimeout(function () {
              map.flyToBounds(bounds, { maxZoom: 5, duration: 0.8, padding: [50, 50] });
            }, 300);

            // Apply flag fill
            try {
              grp.forEach(function (l, idx) { applyFlagFill(l, country, idx); });
            } catch (e) {}
            if (country.name && country.name.common) {
              flaggedCountries.add(country.name.common);
              updateFlagCounter();
            }

            // Pre-fill AI facts from passed data (skip Gemini call)
            if (hasPassedFacts) {
              aiLoading.style.display = 'none';
              funFactText.textContent = incomingPayload.funFact || 'No fun fact available.';
              dishText.textContent = incomingPayload.dish || 'No dish information available.';
              aiContent.style.display = '';
            }
          }
        }

      }).catch(function (err) {
        console.error('Map loading failed:', err);
      });

      function findCountryByNumeric(countries, numericId) {
        if (numericId == null || !countries || countries.length === 0) return null;
        var idStr = String(numericId);
        while (idStr.length < 3) idStr = '0' + idStr;
        return countries.find(function (c) {
          return c.ccn3 === idStr || c.ccn3 === String(numericId);
        }) || null;
      }

      // Secondary match by name for countries whose numeric code didn't match
      function findCountryByName(countries, name) {
        if (!name || !countries || countries.length === 0) return null;
        var lower = name.toLowerCase();
        return countries.find(function (c) {
          return c.name.common.toLowerCase() === lower ||
                 (c.name.official && c.name.official.toLowerCase() === lower);
        }) || null;
      }

      // Hardcoded data for disputed/partly-recognized territories that have no
      // numeric ID in the TopoJSON. Keyed by the EXACT feature name used by
      // world-atlas (Natural Earth), so they map only to their own polygon.
      var TERRITORY_BY_NAME = {
        'N. Cyprus': {
          name: { common: 'Northern Cyprus', official: 'Turkish Republic of Northern Cyprus' },
          flags: { svg: 'https://upload.wikimedia.org/wikipedia/commons/1/1e/Flag_of_the_Turkish_Republic_of_Northern_Cyprus.svg', png: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Flag_of_the_Turkish_Republic_of_Northern_Cyprus.svg/320px-Flag_of_the_Turkish_Republic_of_Northern_Cyprus.svg.png' },
          population: 326000, region: 'Europe', subregion: 'Southern Europe',
          capital: ['North Nicosia'], currencies: { TRY: { name: 'Turkish lira', symbol: '\u20ba' } },
          languages: { tur: 'Turkish' }, latlng: [35.2, 33.7], ccn3: 'NC1', cca3: 'NC1'
        },
        'Somaliland': {
          name: { common: 'Somaliland', official: 'Republic of Somaliland' },
          flags: { svg: 'https://upload.wikimedia.org/wikipedia/commons/4/4d/Flag_of_Somaliland.svg', png: 'https://flagcdn.com/w320/so.png' },
          population: 5700000, region: 'Africa', subregion: 'Eastern Africa',
          capital: ['Hargeisa'], currencies: { SLS: { name: 'Somaliland shilling', symbol: 'Sl' } },
          languages: { som: 'Somali', ara: 'Arabic' }, latlng: [9.56, 44.06], ccn3: 'SL1', cca3: 'SL1'
        },
        'Kosovo': {
          name: { common: 'Kosovo', official: 'Republic of Kosovo' },
          flags: { svg: 'https://flagcdn.com/xk.svg', png: 'https://flagcdn.com/w320/xk.png' },
          population: 1800000, region: 'Europe', subregion: 'Southeast Europe',
          capital: ['Pristina'], currencies: { EUR: { name: 'Euro', symbol: '\u20ac' } },
          languages: { sqi: 'Albanian', srp: 'Serbian' }, latlng: [42.6, 21.0], ccn3: 'XK1', cca3: 'XKX'
        }
      };

      // --- Highlight visited countries on map ---
      function highlightVisitedOnMap() {
        if (!geoLayer) return;
        var visited = getVisited();
        geoLayer.eachLayer(function (layer) {
          if (layer._countryData && visited.includes(layer._countryData.name.common)) {
            clearFlagFill(layer);
            layer.setStyle(visitedStyle());
            // Reset SVG fill to use Leaflet style instead of flag pattern
            if (layer._path) {
              layer._path.removeAttribute('fill');
              layer._path.removeAttribute('fill-opacity');
              layer._path.removeAttribute('stroke');
              layer._path.removeAttribute('stroke-width');
              layer._path.removeAttribute('stroke-opacity');
            }
            layer.setStyle(visitedStyle());
          }
        });
      }

      // Helper: get all sibling layers for a country
      function getGroup(layer) {
        return layer._countryGroup || [layer];
      }

      // Helper: get the local landmass cluster a layer belongs to
      function getCluster(layer) {
        return layer._cluster || getGroup(layer);
      }

      // --- Mouse events ---
      function onMouseOver(e) {
        var layer = e.target;
        if (isTouch || isDragging) return; // ignore hover while panning / on touch
        if (layer._featureId === '010') return; // skip Antarctica (avoids pole line)
        var group = getCluster(layer);
        // Skip if any part of this cluster is currently selected
        if (group.indexOf(selectedLayer) !== -1) return;
        if (detailOverlay.classList.contains('open')) return;
        // Skip if this country already has a flag applied
        if (layer._flagPatternId) return;
        group.forEach(function (l) { if (!l._flagPatternId) l.setStyle(hoverStyle()); });
      }

      function onMouseOut(e) {
        var layer = e.target;
        if (layer._featureId === '010') return; // skip Antarctica (avoids pole line)
        var group = getCluster(layer);
        if (group.indexOf(selectedLayer) !== -1) return;
        // Skip if this country has a flag applied
        if (layer._flagPatternId) return;
        var isVis = layer._countryData && isVisited(layer._countryData.name.common);
        var style = isVis ? visitedStyle() : defaultStyle();
        group.forEach(function (l) { if (!l._flagPatternId) l.setStyle(style); });
      }

      function onCountryClick(e) {
        var layer = e.target;
        var country = layer._countryData;
        if (!country) {
          var fname = (layer.feature && layer.feature.properties && layer.feature.properties.name) || '';
          if (!fname) return;
          country = {
            name: { common: fname }, flags: {}, population: null,
            region: '', subregion: '', capital: [], currencies: {},
            languages: {}, latlng: null, ccn3: layer._featureId || '', cca3: ''
          };
          // Set on all siblings
          getGroup(layer).forEach(function (l) { l._countryData = country; });
        }

        // Deselect previous country group (but keep its flag)
        if (selectedLayer && getGroup(selectedLayer).indexOf(layer) === -1) {
          selectedLayer = null;
        }

        selectedLayer = layer;
        currentCountry = country;

        // Show detail panel
        showDetail(country);

        // Fly to the clicked landmass cluster (not the whole country, so a
        // click on mainland France doesn't zoom out to fit French Guiana too)
        var group = getGroup(layer);
        var cluster = getCluster(layer);
        var bounds = L.latLngBounds([]);
        cluster.forEach(function (l) { bounds.extend(l.getBounds()); });
        map.flyToBounds(bounds, { maxZoom: 5, duration: 0.8, padding: [50, 50] });

        // Fill each island with its own fitted flag pattern
        try {
          group.forEach(function (l, idx) {
            applyFlagFill(l, country, idx);
          });
        } catch (err) {
          console.error('Flag fill failed:', err);
        }

        // Track this country as flagged
        if (country.name && country.name.common) {
          flaggedCountries.add(country.name.common);
          updateFlagCounter();
        }
      }

      // --- SVG Flag Fill (per-island: each path gets its own pattern) ---
      function applyFlagFill(layer, country, idx) {
        var flagUrl = country.flags && country.flags.svg ? country.flags.svg : '';
        if (!flagUrl) {
          layer.setStyle({ fillColor: '#6C63FF', fillOpacity: 0.7, weight: 2, color: '#fff', opacity: 1 });
          return;
        }

        var renderer = map.getRenderer(layer);
        var svgRoot = renderer && renderer._container;
        if (!svgRoot) return;

        var pathEl = layer._path;
        if (!pathEl) return;

        var defs = svgRoot.querySelector('defs');
        if (!defs) {
          defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
          svgRoot.insertBefore(defs, svgRoot.firstChild);
        }

        // Unique pattern per island piece
        var patternId = 'flag-' + (country.ccn3 || country.cca3 || 'x') + '-' + (idx || 0);

        var existingPat = document.getElementById(patternId);
        if (existingPat) existingPat.remove();

        var pattern = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
        pattern.setAttribute('id', patternId);
        pattern.setAttribute('patternUnits', 'objectBoundingBox');
        pattern.setAttribute('patternContentUnits', 'objectBoundingBox');
        pattern.setAttribute('width', '1');
        pattern.setAttribute('height', '1');

        var image = document.createElementNS('http://www.w3.org/2000/svg', 'image');
        image.setAttributeNS('http://www.w3.org/1999/xlink', 'href', flagUrl);
        image.setAttribute('href', flagUrl);
        image.setAttribute('x', '0');
        image.setAttribute('y', '0');
        image.setAttribute('width', '1');
        image.setAttribute('height', '1');
        image.setAttribute('preserveAspectRatio', 'none');

        pattern.appendChild(image);
        defs.appendChild(pattern);

        var fillRef = 'url(#' + patternId + ')';

        layer.setStyle({
          fillColor: fillRef,
          fillOpacity: 1,
          weight: 2,
          color: '#ffffff',
          opacity: 1
        });

        if (pathEl) {
          pathEl.setAttribute('fill', fillRef);
          pathEl.setAttribute('fill-opacity', '1');
          pathEl.setAttribute('stroke', '#ffffff');
          pathEl.setAttribute('stroke-width', '2');
          pathEl.setAttribute('stroke-opacity', '1');
        }

        layer._flagPatternId = patternId;
      }

      function clearFlagFill(layer) {
        if (layer._flagPatternId) {
          var el = document.getElementById(layer._flagPatternId);
          if (el) el.remove();
          delete layer._flagPatternId;
        }
      }

      // --- Panel open/close helpers ---
      function openPanel() {
        detailOverlay.classList.add('open');
        document.body.classList.add('panel-open');
      }

      function closePanel() {
        detailOverlay.classList.remove('open');
        document.body.classList.remove('panel-open');
        // If the selected country is visited, restore green style and remove flag
        if (selectedLayer && currentCountry && isVisited(currentCountry.name.common)) {
          var group = getGroup(selectedLayer);
          group.forEach(function (l) {
            clearFlagFill(l);
            if (l._path) {
              l._path.removeAttribute('fill');
              l._path.removeAttribute('fill-opacity');
              l._path.removeAttribute('stroke');
              l._path.removeAttribute('stroke-width');
              l._path.removeAttribute('stroke-opacity');
            }
            l.setStyle(visitedStyle());
          });
        }
        selectedLayer = null;
        currentCountry = null;
      }

      // --- Lightbox ---
      var lightbox = document.createElement('div');
      lightbox.className = 'img-lightbox';
      lightbox.innerHTML = '<button class="img-lightbox-close" title="Close">&times;</button>' +
        '<button class="img-lightbox-nav img-lightbox-prev" title="Previous">&#8249;</button>' +
        '<img src="" alt="">' +
        '<button class="img-lightbox-nav img-lightbox-next" title="Next">&#8250;</button>' +
        '<div class="img-lightbox-counter"></div>';
      document.body.appendChild(lightbox);
      var lightboxImg = lightbox.querySelector('img');
      var lightboxCounter = lightbox.querySelector('.img-lightbox-counter');
      var lightboxGallery = [];
      var lightboxIdx = 0;

      function closeLightbox() { lightbox.classList.remove('open'); }
      function showLightboxImage(idx) {
        if (idx < 0 || idx >= lightboxGallery.length) return;
        lightboxIdx = idx;
        lightboxImg.classList.add('loading');
        var highRes = lightboxGallery[idx].replace(/\/\d+px-/, '/1200px-');
        var temp = new Image();
        temp.onload = function () {
          lightboxImg.src = highRes;
          lightboxImg.classList.remove('loading');
        };
        temp.onerror = function () {
          lightboxImg.src = lightboxGallery[idx];
          lightboxImg.classList.remove('loading');
        };
        temp.src = highRes;
        lightboxImg.src = highRes;
        lightboxImg.alt = 'Photo ' + (idx + 1);
        lightboxCounter.textContent = (idx + 1) + ' / ' + lightboxGallery.length;
      }

      lightbox.querySelector('.img-lightbox-close').addEventListener('click', closeLightbox);
      lightbox.querySelector('.img-lightbox-prev').addEventListener('click', function (e) {
        e.stopPropagation();
        showLightboxImage((lightboxIdx - 1 + lightboxGallery.length) % lightboxGallery.length);
      });
      lightbox.querySelector('.img-lightbox-next').addEventListener('click', function (e) {
        e.stopPropagation();
        showLightboxImage((lightboxIdx + 1) % lightboxGallery.length);
      });
      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', function (e) {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') showLightboxImage((lightboxIdx - 1 + lightboxGallery.length) % lightboxGallery.length);
        if (e.key === 'ArrowRight') showLightboxImage((lightboxIdx + 1) % lightboxGallery.length);
      });

      function openLightbox(srcs, startIdx) {
        lightboxGallery = srcs;
        lightbox.classList.add('open');
        showLightboxImage(startIdx || 0);
        srcs.forEach(function (s) { var i = new Image(); i.src = s.replace(/\/\d+px-/, '/1200px-'); });
      }

      // --- Country Images ---
      var _allCountryPhotos = [];
      var _currentImgCountry = '';
      var _imgPage = 1;
      var _imgTotalPages = 1;

      function showPhotosInGrid(photos, countryName) {
        var grid = document.getElementById('countryImagesGrid');
        if (!grid) return;
        grid.innerHTML = '';
        photos.forEach(function (photo, idx) {
          var img = document.createElement('img');
          img.alt = photo.alt || countryName;
          img.loading = 'lazy';
          img.src = photo.small;
          img.onerror = function () { this.style.display = 'none'; };
          img.onclick = function () {
            openLightbox(photos.map(function (p) { return p.regular; }), idx);
          };
          grid.appendChild(img);
        });
      }

      function loadCountryImages(countryName) {
        var grid = document.getElementById('countryImagesGrid');
        if (!grid) return;
        if (!UNSPLASH_ACCESS_KEY) {
          grid.innerHTML = '<span style="grid-column:1/-1;text-align:center;opacity:0.5;font-size:0.8rem">Add your Unsplash key in config.js</span>';
          return;
        }
        _currentImgCountry = countryName;
        _imgPage = 1;
        _imgTotalPages = 1;
        _fetchUnsplashPage(countryName, 1, grid);
      }

      function _fetchUnsplashPage(countryName, page, grid) {
        grid.innerHTML = '<span style="grid-column:1/-1;text-align:center;opacity:0.5;font-size:0.8rem">Loading photos...</span>';

        var url = 'https://api.unsplash.com/search/photos?query=' +
          encodeURIComponent(countryName) +
          '&per_page=20&page=' + page + '&client_id=' + UNSPLASH_ACCESS_KEY;

        fetch(url)
          .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
          .then(function (data) {
            _imgTotalPages = data.total_pages || 1;
            var results = data.results || [];
            if (results.length === 0) {
              grid.innerHTML = '<span style="grid-column:1/-1;text-align:center;opacity:0.4;font-size:0.8rem">No photos found</span>';
              _allCountryPhotos = [];
              return;
            }
            _allCountryPhotos = results.map(function (r) {
              return {
                small: r.urls.small,
                regular: r.urls.regular,
                alt: r.alt_description || countryName
              };
            });
            showPhotosInGrid(_allCountryPhotos, countryName);
          })
          .catch(function (err) {
            grid.innerHTML = '<span style="grid-column:1/-1;text-align:center;opacity:0.4;font-size:0.8rem">Could not load photos</span>';
          });
      }

      document.getElementById('refreshImagesBtn').addEventListener('click', function () {
        if (_currentImgCountry && UNSPLASH_ACCESS_KEY) {
          _imgPage++;
          if (_imgPage > _imgTotalPages) _imgPage = 1;
          var grid = document.getElementById('countryImagesGrid');
          _fetchUnsplashPage(_currentImgCountry, _imgPage, grid);
        }
      });

      // --- Passport strength ---
      function passportLabel(rank) {
        if (rank <= 10) return 'Very strong';
        if (rank <= 25) return 'Strong';
        if (rank <= 60) return 'Moderate';
        return 'Limited';
      }
      function passportCoverColor(c) { return '#1b3a63'; }
      // Rank of each passport WITHIN its region (dense rank by visa-free score)
      var _regionRankCache = null;
      function regionRankFor(country) {
        if (!_regionRankCache) {
          _regionRankCache = {};
          var byRegion = {};
          (countriesCache || []).forEach(function (c) {
            if (c.passport && c.passport.rank) (byRegion[c.region] = byRegion[c.region] || []).push(c);
          });
          Object.keys(byRegion).forEach(function (region) {
            var arr = byRegion[region].slice().sort(function (a, b) { return b.passport.visaFree - a.passport.visaFree; });
            var lastVf = null, lastRank = 0;
            arr.forEach(function (c, i) {
              var rank = (c.passport.visaFree === lastVf) ? lastRank : (i + 1);
              lastVf = c.passport.visaFree; lastRank = rank;
              _regionRankCache[c.cca3] = rank;
            });
          });
        }
        return _regionRankCache[country.cca3] || null;
      }
      // A fact specific to THIS passport, derived from its real standing
      function passportFactText(country) {
        var p = country.passport, region = country.region || 'its region';
        var rr = regionRankFor(country);
        var parts = ['Ranked #' + p.rank + ' worldwide'];
        if (rr) parts.push(rr === 1 ? ('the strongest passport in ' + region) : ('#' + rr + ' in ' + region));
        return parts.join(' and ') + ', it opens ' + p.visaFree + ' destinations visa-free.';
      }
      // Set image with an ordered fallback chain (passportindex -> wiki -> flag)
      function setPassportImg(el, srcs) {
        var arr = []; srcs.forEach(function (s) { if (s && arr.indexOf(s) === -1) arr.push(s); });
        var i = 0;
        el.onerror = function () { i++; if (i < arr.length) el.src = arr[i]; else el.onerror = null; };
        if (arr.length) el.src = arr[0];
      }
      function renderPassport(country) {
        var p = country && country.passport;
        if (!(p && p.rank)) { detailPassportBlock.style.display = 'none'; return; }
        var flag = (country.flags && (country.flags.png || country.flags.svg)) || '';
        var srcs = [country.passportImage, country.passportImageAlt, flag];
        if (srcs.some(Boolean)) { setPassportImg(detailPassportPhoto, srcs); detailPassportPhoto.style.display = ''; }
        else { detailPassportPhoto.style.display = 'none'; }
        detailPassportText.textContent = 'Global rank #' + p.rank + '  \u00b7  ' + p.visaFree + ' destinations visa-free  \u00b7  ' + passportLabel(p.rank);
        detailPassportFact.textContent = passportFactText(country);
        detailPassportBlock.style.display = '';
      }

      // --- Detail Panel ---
      function showDetail(country, skipAI) {
        // Flag image
        if (country.flags && country.flags.svg) {
          detailFlag.src = country.flags.svg;
          detailFlag.style.display = '';
        } else if (country.flags && country.flags.png) {
          detailFlag.src = country.flags.png;
          detailFlag.style.display = '';
        } else {
          detailFlag.src = '';
          detailFlag.style.display = 'none';
        }
        detailFlag.alt = (country.name.common || 'Country') + ' flag';
        detailName.textContent = country.name.common || 'Unknown';
        detailCapital.textContent = country.capital && country.capital.length ? country.capital[0] : 'N/A';
        detailPopulation.textContent = 'Population: ' + (country.population != null ? country.population.toLocaleString() : 'N/A');

        // Currency
        var currStr = '--';
        if (country.currencies && Object.keys(country.currencies).length > 0) {
          currStr = Object.values(country.currencies).map(function (c) {
            return c.name + (c.symbol ? ' (' + c.symbol + ')' : '');
          }).join(', ');
        }
        detailCurrency.textContent = currStr;

        // Languages
        var langStr = '--';
        if (country.languages && Object.keys(country.languages).length > 0) {
          langStr = Object.values(country.languages).join(', ');
        }
        detailLanguages.textContent = langStr;

        renderPassport(country);
        // Map embed
        if (country.latlng && country.latlng.length === 2) {
          detailMapFrame.src = 'https://www.google.com/maps?q=' + country.latlng[0] + ',' + country.latlng[1] + '&z=5&output=embed';
        } else {
          detailMapFrame.src = 'https://www.google.com/maps?q=' + encodeURIComponent(country.name.common) + '&z=5&output=embed';
        }

        // Badges
        detailBadges.innerHTML = '';
        if (country.region) {
          var b = document.createElement('span');
          b.className = 'badge';
          b.textContent = country.region;
          detailBadges.appendChild(b);
        }
        if (country.subregion) {
          var b2 = document.createElement('span');
          b2.className = 'badge';
          b2.textContent = country.subregion;
          detailBadges.appendChild(b2);
        }

        updateVisitedBadge();

        // Country images
        loadCountryImages(country.name.common);

        // AI content
        aiLoading.style.display = 'none';
        aiContent.style.display = 'none';
        funFactText.textContent = '';
        dishText.textContent = '';

        if (apiKey && !skipAI) {
          fetchAIContent(country.name.common);
        }

        // Open panel
        openPanel();
      }

      function updateVisitedBadge() {
        if (!currentCountry) return;
        var name = currentCountry.name.common;
        var existing = detailBadges.querySelector('.visited-badge');
        if (isVisited(name)) {
          if (!existing) {
            var b = document.createElement('span');
            b.className = 'badge visited-badge';
            b.textContent = 'Visited';
            detailBadges.appendChild(b);
          }
          markVisitedBtn.textContent = 'Already Visited';
          markVisitedBtn.classList.add('already-visited');
          detailPanel.classList.add('visited-glow');
        } else {
          if (existing) existing.remove();
          markVisitedBtn.textContent = 'Mark as Visited';
          markVisitedBtn.classList.remove('already-visited');
          detailPanel.classList.remove('visited-glow');
        }
      }

      // --- Close panel ---
      detailClose.addEventListener('click', closePanel);

      // Close on Escape
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closePanel();
      });

      // --- Mark Visited ---
      markVisitedBtn.addEventListener('click', function () {
        if (!currentCountry) return;
        var name = currentCountry.name.common;
        toggleVisited(name);
        // Instantly apply green to this country's layers
        if (geoLayer && isVisited(name)) {
          var group = selectedLayer ? getGroup(selectedLayer) : [];
          group.forEach(function (l) {
            clearFlagFill(l);
            if (l._path) {
              l._path.removeAttribute('fill');
              l._path.removeAttribute('fill-opacity');
              l._path.removeAttribute('stroke');
              l._path.removeAttribute('stroke-width');
              l._path.removeAttribute('stroke-opacity');
            }
            l.setStyle(visitedStyle());
          });
          // Also catch any other layers for this country not in the group
          highlightVisitedOnMap();
        }
      });

      // --- Country data (bundled locally; no live API needed) ---
      async function fetchAllCountries() {
        if (countriesCache) return countriesCache;
        if (typeof COUNTRIES_DATA !== 'undefined' && Array.isArray(COUNTRIES_DATA) && COUNTRIES_DATA.length) {
          countriesCache = COUNTRIES_DATA;
          return countriesCache;
        }
        throw new Error('Country data failed to load. Make sure countries-data.js is present.');
      }

      // --- Gemini AI ---
      async function fetchAIContent(countryNameStr) {
        if (!apiKey) return;

        // Check cache first (expires after 24h for fresh content)
        var cacheKey = 'ai_cache_' + countryNameStr.toLowerCase().replace(/\s+/g, '_');
        try {
          var cached = localStorage.getItem(cacheKey);
          if (cached) {
            var cacheData = JSON.parse(cached);
            if (cacheData._ts && Date.now() - cacheData._ts < 86400000) {
              funFactText.textContent = cacheData.funFact || 'No fun fact available.';
              dishText.textContent = cacheData.dish || 'No dish information available.';
              aiLoading.style.display = 'none';
              aiContent.style.display = '';
              return;
            }
            localStorage.removeItem(cacheKey);
          }
        } catch (_) {}

        aiLoading.style.display = '';
        aiLoading.innerHTML = '<span class="spinner"></span> Fetching AI insights...';
        aiContent.style.display = 'none';

        var models = ['gemini-2.5-flash-lite', 'gemini-2.5-flash', 'gemini-3-flash-preview', 'gemini-3.1-flash-lite-preview'];
        var baseUrl = 'https://generativelanguage.googleapis.com/v1beta/models/';

        var body = {
          contents: [{
            parts: [{
              text: 'You are a geography and culture expert. For the country "' + countryNameStr + '" specifically (not any other country), provide:\n1. One unique, surprising, and ACCURATE fun fact that is specific ONLY to ' + countryNameStr + '. Do NOT reuse generic facts that could apply to multiple countries.\n2. One authentic traditional local dish that originates from ' + countryNameStr + ', with a brief description of what it is.\nRespond ONLY with valid JSON, no markdown, no explanation: { "funFact": "...", "dish": "..." }'
            }]
          }],
          generationConfig: {
            temperature: 1.2
          }
        };

        var resp;
        var modelIdx = 0;

        while (true) {
          var url = baseUrl + models[modelIdx] + ':generateContent?key=' + apiKey;

          // 8-second timeout per model attempt
          var controller = new AbortController();
          var timeoutId = setTimeout(function () { controller.abort(); }, 8000);

          try {
            resp = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
              signal: controller.signal
            });
          } catch (fetchErr) {
            clearTimeout(timeoutId);
            if (modelIdx < models.length - 1) {
              modelIdx++;
              aiLoading.innerHTML = '<span class="spinner"></span> Switching model...';
              continue;
            }
            aiLoading.style.display = 'none';
            return;
          }
          clearTimeout(timeoutId);

          if (resp.status === 429 || resp.status === 503) {
            if (modelIdx < models.length - 1) {
              modelIdx++;
              aiLoading.innerHTML = '<span class="spinner"></span> High Demand — switching model...';
              continue;
            }
            aiLoading.style.display = 'none';
            return;
          }

          if (!resp.ok) {
            if (modelIdx < models.length - 1) { modelIdx++; continue; }
            aiLoading.style.display = 'none';
            return;
          }
          break;
        }

        try {
          var data = await resp.json();
          var text = '';
          if (data.candidates && data.candidates[0] && data.candidates[0].content) {
            text = data.candidates[0].content.parts.map(function (p) { return p.text || ''; }).join('');
          }
          var jsonMatch = text.match(/\{[\s\S]*\}/);
          if (!jsonMatch) {
            funFactText.textContent = 'Could not parse AI response.';
            dishText.textContent = 'Could not parse AI response.';
            aiLoading.style.display = 'none';
            aiContent.style.display = '';
            return;
          }
          var parsed = JSON.parse(jsonMatch[0]);
          // Cache the result with timestamp
          parsed._ts = Date.now();
          try { localStorage.setItem(cacheKey, JSON.stringify(parsed)); } catch (_) {}
          funFactText.textContent = parsed.funFact || 'No fun fact available.';
          dishText.textContent = parsed.dish || 'No dish information available.';
          aiLoading.style.display = 'none';
          aiContent.style.display = '';
        } catch (err) {
          aiLoading.style.display = 'none';
          funFactText.textContent = 'Could not fetch AI insights.';
          dishText.textContent = '';
          aiContent.style.display = '';
        }
      }

      // --- Init ---
      updateStats();

    })();
  </script>
</body>
</html>
