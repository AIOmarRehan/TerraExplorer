name = "terraexplorer-api"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = true

[vars]
# Public origins allowed to call this API from a browser.
# Add your custom domain here if you stop using the GitHub Pages origin.
ALLOWED_ORIGINS = "https://aiomarrehan.github.io,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500"
UNSPLASH_UTM_SOURCE = "terraexplorer"

# Approximate per-location limits. The IP key is the only stable identifier
# available for an anonymous public API; Cloudflare's limiter is not global.
[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "AI_GLOBAL_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "PHOTOS_RATE_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "PHOTOS_GLOBAL_RATE_LIMITER"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 60
  period = 60
