name: Weekly data refresh

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC
  workflow_dispatch:        # allow manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # commit the refreshed countries-data.js
      actions: write    # start the Deploy to GitHub Pages workflow
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Rebuild country data
        run: node scripts/build-data.mjs

      - name: Validate data file
        run: node --check countries-data.js

      - name: Commit data if it changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain countries-data.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add countries-data.js
            git commit -m "chore: weekly passport/country data refresh"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No data changes this week."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN do not trigger push workflows, but a
      # workflow_dispatch does. This keeps a single deployment pipeline.
      - name: Start Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: gh workflow run deploy.yml --ref "$REF"
